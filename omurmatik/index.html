function piktogram(ad, fiyat) {
  const p = PIK[ad]; if (!p) return "";
  // lahmacun etiketi beş harfe göre çizildi ("999 ₺"); uzun fiyatta yazı küçülür

}

// Emeklilik kuralı sigortanın başladığı yıla bağlıdır, doğum yılına değil (GDD > Oyun Datası > EYT). Oyuncu erkek tablosuyla:

function emekliKural(pb = S.primBas ?? S.yil) {

  if (pb < 2008) return { grup: "orta", ad: `1999-2008 kuralı (girişin ${pb})`, yas: () => 60, kisa: "60 yaş", yasa: "1999-2008 arası, 60 yaş" };
  return { grup: "yeni", ad: `2008 sonrası kuralı (girişin ${pb})`, yas: y => y <= 2035 ? 60 : y <= 2043 ? 61 + Math.floor((y - 2036) / 2) : 65, kisa: "60-65 yaş, emeklilik yılına göre", yasa: "2008 sonrası, emeklilik yılına göre, 60-65 yaş" };

// Karşılaştırma: tek 0-1 milyar cetvelinde üstte ilk, altta son tahmin ve yeşil gerçek yer; altında yaş/yıl cetveli.
function karsilastir() {
  const DOGRU = 1e6 / 1e9, on = S.algi.on, son = S.algi.son, hata = x => Math.abs(x - DOGRU);
  const kat = on == null ? null : hata(son) === 0 ? Infinity : hata(on) / hata(son);
  const sonuc = kat == null ? "" : kat === Infinity ? "Tam yerine koydun." : kat >= 1.05 ? `${kat >= 10 ? Math.round(kat).toLocaleString("tr-TR") : kat.toLocaleString("tr-TR", { maximumFractionDigits: 1 })} kat yaklaştın.` : kat > 0.95 ? "İlk tahmininle aynı yerdesin." : "Bu kez daha uzağa koydun.";
  // Algı puanı (v3.5): cevabın 1 milyondan kaç kat saptığına göre; tam yerde algiTam, algiSifirKat kat sapmada 0, arası logaritmik
  const algi = o => o <= 0 ? 0 : Math.round(D.puan.algiTam * Math.max(0, 1 - Math.abs(Math.log10(o / DOGRU)) / Math.log10(D.puan.algiSifirKat)));
  const milyon = o => { const m = o * 1000; return (m < 10 ? m.toLocaleString("tr-TR", { maximumFractionDigits: 1 }) : Math.round(m).toLocaleString("tr-TR")) + " milyon"; };
  const pct = o => +(Math.min(1, Math.max(0, o)) * 100).toFixed(3);
  const gercek = `<div class="gercek"><svg viewBox="0 0 12 22" aria-hidden="true"><path d="M6 1 L1 8 H4.5 V21 H7.5 V8 H11 Z"/></svg><span>Gerçek yeri: 1 milyon <small>(binde bir)</small></span></div>`;
  const olcekCetvel = `<div class="algi kucuk tek${on == null ? " ilk-yok" : ""}"><div class="ray">${on == null ? "" : `<i class="topuz ilk" style="left:${pct(on)}%;--tx:${pct(on)}%"></i>`}<i class="topuz son" style="left:${pct(son)}%;--tx:${pct(son)}%"></i><i class="dogru"></i></div>${gercek}<div class="uclar"><span>0</span><span>1 milyar</span></div></div>`;
  const kalan = Math.max(0, nakit()) + evDeger() + digerDeger() + (S.araba ? satisDegeri("araba") : 0) + (S.esAraba ? satisDegeri("esAraba") : 0);
  const tahminYil = S.hedef - 18, gecenYil = S.yas - 18;
  const yilMetni = S.yas < S.hedef
    ? `1 milyon dolar ${tahminYil} yıl yeter demiştin, ${gecenYil} yıl yetti.`
    : kalan > 0
      ? `1 milyon dolar ${tahminYil} yıl yeter demiştin, ${tlKisa(kalan)} (${usdK(kalan)}) fazla bile geldi.`
      : `1 milyon dolar ${tahminYil} yıl yeter demiştin, tam ${gecenYil} yıl yetti!`;
  const sonUc = S.gecmis.slice(-3), netGid = sonUc.length ? sonUc.reduce((a, g) => a + (g.gid - g.kaz), 0) / sonUc.length : 0;
  const kaz = S.yas >= S.hedef && S.sonuc !== "Doğal yollarla ölmedin.";
  const biterdi = kaz && kalan > 0 && netGid > 0 ? Math.min(120, S.yas + Math.floor(kalan / netGid)) : null;
  const ustYas = Math.max(60, Math.ceil(Math.max(S.hedef, S.yas, biterdi || S.yas) / 10) * 10);
  const yasPct = y => +((Math.min(ustYas, Math.max(18, y)) - 18) / (ustYas - 18) * 100).toFixed(2);
  const tahminP = yasPct(S.hedef), yasP = yasPct(S.yas);
  const altYas = kaz && kalan > 0 && biterdi != null ? biterdi : S.yas;
  const altP = yasPct(altYas);
  const altYazi = kaz && kalan > 0
    ? (biterdi != null ? `Biterdi: ${biterdi} yaş (${gecenYil}+ yıl)` : `Yetti: ${gecenYil}+ yıl · ${S.yas} yaş`)
    : `Yetti: ${gecenYil} yıl · ${S.yas} yaş`;
  const uzatma = kaz && kalan > 0 && biterdi != null && biterdi > S.yas ? `<i class="uzar" style="left:${yasP}%;width:${+(altP - yasP).toFixed(2)}%"></i>` : "";
  const yilCetvel = `<div class="bt-yas"><div class="ray"><i class="dolu" style="width:${yasP}%"></i>${uzatma}<i class="iz bt-ust" style="left:${tahminP}%"></i><span class="im bt-ust" style="left:${tahminP}%;--tx:${tahminP}%">Tahmin: ${tahminYil} yıl · ${S.hedef} yaş</span><i class="iz bt-alt" style="left:${altP}%"></i><span class="im bt-alt" style="left:${altP}%;--tx:${altP}%">${altYazi}</span></div><div class="uclar"><span>18</span><span>${ustYas}</span></div></div>`;
  const olcekPuan = algi(son);
  S.olcekPuan = olcekPuan;
  let yilPuan = S.yilPuan;
  if (yilPuan == null) {
    const varis = kaz ? (kalan <= 0 ? S.yas : biterdi ?? Infinity) : S.yas, fark = Math.abs(varis - S.hedef);
    yilPuan = Math.round(100 * Math.max(0, Math.min(1, (D.puan.isabetSifirYil - fark) / (D.puan.isabetSifirYil - D.puan.isabetTamYil))));
    S.yilPuan = yilPuan;
  }
  serefGuncelle(olcekPuan, yilPuan);
  $("bitis").innerHTML = `<div class="test"><div class="card v5 bt"><h1>Bitiş Testi</h1><div class="alt-bas">tahminlerin ve gerçek sonuç</div>
    <h2 class="bt-bolum">1. Ölçek Tahminin</h2>
    ${olcekCetvel}
    <div class="kutu">${on == null ? "" : `İlk ${milyon(on)}, `}${on == null ? "Cevabın" : "son"} ${milyon(son)}; doğrusu 1 milyon (binde bir). <b>${sonuc}</b><div class="algiPuan">Ölçek Tahmini Puanı: <b>${olcekPuan}</b>/${D.puan.algiTam}${on == null ? "" : ` <span>(başta ${algi(on)})</span>`}</div></div>
    <h2 class="bt-bolum">2. Yıl Tahminin</h2>
    ${yilCetvel}
    <div class="kutu bt-yil">${yilMetni}<div class="algiPuan">Yıl Tahmini Puanı: <b>${yilPuan}</b>/100</div></div>
    <button class="opt" id="puanHesaplaBtn">Puan Hesapla</button></div></div>`;
  $("puanHesaplaBtn").onclick = puanEkraniAc;
  $("puanHesaplaBtn").focus();
}

// Klavye: yön tuşları seçer, Enter onaylar, A (ya da P) Arşiv, Esc kapatır.
// Izgarada gezinme (ana ekran ve pencereler aynı): sol/sağ sıradaki, yukarı/aşağı seçenek ızgarasında bir satır;
// ızgaranın sonundan sonraki öğeye (pencerede TAMAM, ana ekranda DEVAM) geçer, oradan yukarı ızgaraya döner.
const OKLAR = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
function izgaraGez(L, a, key) {
  let i = L.indexOf(a);
  if (i < 0) return key === "ArrowUp" || key === "ArrowLeft" ? L.length - 1 : 0;
  if (key === "ArrowLeft") return Math.max(0, i - 1);
  if (key === "ArrowRight") return Math.min(L.length - 1, i + 1);
  const box = a.parentElement, cols = box.classList.contains("opts") ? getComputedStyle(box).gridTemplateColumns.split(" ").length : 1;
  const k = L.filter(el => el.parentElement === box), j = k.indexOf(a), hedef = j + (key === "ArrowDown" ? cols : -cols);
  if (j >= 0 && hedef >= 0 && hedef < k.length) return L.indexOf(k[hedef]);
  if (key === "ArrowDown") { const son = L.indexOf(k[k.length - 1]); return Math.min(L.length - 1, (son < 0 ? i : son) + 1); }
  const ilk = L.indexOf(k[0]); return ilk > 0 ? ilk - 1 : ilk < 0 ? Math.max(0, i - 1) : i;   // en üst satırda yukarı: yerinde kalır
}
document.addEventListener("keydown", e => {
  const ac = el => el.classList.contains("open");
  if (ac($("popup"))) {
    if (e.key === "Escape" && !S.bitti) { e.preventDefault(); ($("popIptal") || $("popOk")).click(); }
    if (e.key === "Enter" && !$("popup").contains(document.activeElement)) { e.preventDefault(); $("popOk").click(); }   // odak pencerede değilse Enter pencereyi onaylar
    // seçimli pencerede Enter, ana ekrandaki gibi tek basışta: seçeneği seçer ve onaylar (fareyle seçip TAMAM'a basmak da çalışır)
    const sec = document.activeElement;
    if (e.key === "Enter" && sec && sec.matches("#popM .opts .opt") && !sec.closest(".yat, .karar1c") && popIs && !S.bitti) {
      e.preventDefault(); sec.click(); if (!$("popOk").disabled && $("popup").classList.contains("open")) $("popOk").click(); return;
    }
    if (OKLAR.includes(e.key)) {   // pencerede seçenekler, kaydırıcı ve TAMAM arasında gezin (X'e Esc ile)
      const a = document.activeElement;
      if (a && a.matches("#popup input:not([type=range]), #popup textarea")) return;   // yazı kutusunda oklar metinde gezer
      if (a && a.matches("#popup input[type=range]") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;   // kaydırıcı oynar
      const L = [...document.querySelectorAll("#popM .opt:not(:disabled), #popM input:not(:disabled), #popOk:not(:disabled)")].filter(el => el.offsetParent);
      if (!L.length) return;   // gezilecek bir şey yoksa oklar uzun metni kaydırır
      e.preventDefault(); const h = L[izgaraGez(L, a, e.key)]; h.focus(); h.scrollIntoView({ block: "nearest" });
    }
    return;
  }
  if (ac($("mailBox"))) {
    if (e.key === "Escape" || "pPaA".includes(e.key)) { e.preventDefault(); $("mailClose").click(); setTimeout(() => $("go").focus()); }
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); const F = ["hepsi", "gelir", "gider", "genel"]; S.postaFiltre = F[(F.indexOf(S.postaFiltre) + (e.key === "ArrowRight" ? 1 : 3)) % 4]; postaAc(); }
    return;
  }
  if ($("start")) return;
  const a = document.activeElement;
  if (e.key === "Enter" && a && a.matches(".box.sell")) { e.preventDefault(); a.click(); const sb = $("people").querySelector(".satBtn"); if (sb) sb.focus(); return; }
  if ("pPaA".includes(e.key) && e.key.length === 1) { e.preventDefault(); postaAc(); return; }
  if (e.key === "Enter" && (!a || a === document.body)) { e.preventDefault(); $("go").click(); return; }
  if (!OKLAR.includes(e.key)) return;
  if (a && (a.type === "radio" || (a.type === "range" && (e.key === "ArrowLeft" || e.key === "ArrowRight")))) return;
  const L = [...document.querySelectorAll("#feed .opt:not(:disabled), #feed .karar-ac-btn:not(:disabled), #feed input[type=range]:not(:disabled), #go:not(:disabled)")].filter(el => el.offsetParent);
  if (!L.length) return;
  e.preventDefault();
  const h = L[izgaraGez(L, L.includes(a) ? a : null, e.key)]; h.focus(); h.scrollIntoView({ block: "nearest" });
});
